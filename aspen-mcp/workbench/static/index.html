    <!-- the selection hub's mark on a step (style.css .wb-ref): a straight bar left of it, its height
         less 6 at each end (so it follows neither the notch nor the corners), a gap of the canvas
         between; drawn by the step's own path, so a redraw keeps it -->
    <filter id="f-ref" x="-30%" y="-10%" width="140%" height="120%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="erode" radius="0 6"/>
      <feOffset dx="-9" result="h"/>
      <feFlood class="gap" x="-5" width="5"/>
      <feComposite in2="h" operator="in" result="gap"/>
      <feFlood class="bar" x="-9" width="4"/>
      <feComposite in2="h" operator="in" result="bar"/>
      <feMerge><feMergeNode in="gap"/><feMergeNode in="bar"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </svg>

  <!-- the header runs the model: the tabs; then the model the tab shown works on (#modelstat:
       its file and what Aspen last said of it; a click opens the model panel), Save model and
       Run simulation (each only where the server offers it); the AI's brakes (its mode, Pause
       AI; app-brake.js) and #ai-bar, what the AI is doing (hidden while it does nothing;
       app-conn.js); the connection, the language and the ...
       menu. The block program has its own run bar in the left column (.prog-bar). Buttons
       with data-a go through act() in app-pane.js; the model group is drawn by app-model.js. -->
  <header id="bar">
    <!-- the logo opens Help: the beginner tour, the flowsheet legend, the keys (app-tour.js) -->
    <button id="logo" class="logo icon flat" data-i18n-title="tip_logo" aria-haspopup="menu"><svg class="ic" aria-hidden="true"><use href="#i-logo"/></svg></button>
    <nav id="tabs"></nav>
    <button id="tab-add" class="icon flat" data-icon="plus" data-i18n-title="tab_add"></button>
    <span class="grow"></span>
    <!-- the AI's turn still running (app-conn.js renderThink): "AI is thinking…" (ai_think) and its seconds, the
         same state and count as the chat's waiting line (app-wait.js) -->
    <span id="ai-think" class="ai-think hidden" role="status"></span>
    <span class="model-grp">
      <button id="modelstat" class="modelstat none" data-a="model" aria-haspopup="menu">
        <i class="dot"></i><span class="ms-name"><span class="ms-h"></span><span class="ms-t"></span></span><span class="ms-st"></span>
        <svg class="ic chev" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      </button>
      <button data-a="save_model" class="icon flat hidden" data-icon="save"></button>
      <!-- Run simulation, and ▾ for the other way to run it (Reinitialize first) -->
      <span class="simrun split hidden">
        <button data-a="run_sim" class="primary" data-icon="play" data-i18n="run_sim"></button>
        <button data-a="run_sim_menu" class="primary sim-more" data-icon="chevron-down" data-i18n-title="tip_run_sim_menu" aria-haspopup="menu"></button>
      </span>
    </span>
    <!-- AI review (app-brake.js): the shield and its menu (the review mode, Pause AI),
         Resume and what a pause holds, the pending badge; only where the server has it
         (catalog.features brake). #ai-bar: what the AI is doing, ⏸ at its end. #conn: only when
         not connected as normal (app-conn.js). The language is in the ⋯ menu. -->
    <span id="ai-brake" class="ai-brake hidden" role="group"></span>
    <span id="ai-bar" class="ai-bar hidden" aria-live="polite"></span>
    <span id="conn" class="conn off"><i class="dot"></i><span class="ct"></span></span>
    <!-- the page failed to take the server's last few updates (app-state.js renderStale): a quiet line, Reload -->
    <span id="ui-stale" class="ui-stale hidden" role="status"><span class="us-t"></span><span class="us-sep" aria-hidden="true">·</span><button class="us-go flat"></button></span>
    <button id="btn-more" class="icon flat" data-icon="more" data-i18n-title="tip_more"></button>
  </header>
  <main id="panes">
    <!-- no tab yet: one card that says what to do -->
    <div id="no-tabs" class="empty-card hidden">
      <svg class="ic big" aria-hidden="true"><use href="#i-logo"/></svg>
      <div class="et" data-i18n="empty_title"></div>
      <div class="eb" data-i18n="empty_body"></div>
      <q class="esay" data-i18n="say_open"></q>
      <div class="ea">
        <button id="empty-new" class="primary" data-icon="plus" data-i18n="empty_new"></button>
        <button id="empty-copy" data-icon="copy" data-i18n="empty_copy"></button>
      </div>
    </div>
  </main>
  <!-- workspaces of the tabs not shown: rendered off screen, so a program can load any time -->
  <div id="ws-store"></div>

  <template id="pane-tpl">
    <section class="pane">
      <!-- the program takes the whole left column; the flowsheet sits top right, the dock
           (AI chat, changes, run log, results) under it -->
      <div class="pbody">
        <div class="pleft">
          <!-- the model's sub-tabs (app-subtabs.js): "My program" (prog_mine), its other programs, +, the AI's
               proposals in progress and those opened from History; "History" n (sub_hist) at the right end.
               Hidden while the model has only "My program" -->
          <div class="subtabs hidden">
            <div class="sub-track" role="tablist"></div>
            <button class="sub-hist flat hidden" data-sub="hist" aria-haspopup="dialog" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg><span class="sh-t"></span><b class="sh-n"></b></button>
          </div>
          <!-- the block program's card: its run bar on top (what the program is doing, its
               versions, Check program and Run program, Stop while it runs, its menu), the canvas
               under it. Folded (.closed: app-layout.js), the card keeps its size out of sight
               and the strip below takes the column's 40 px. -->
          <div class="pl-card">
          <div class="prog-bar">
            <!-- fold the column to its strip (the strip's chevron, at the same place, opens it) -->
            <button data-a="prog_fold" class="icon flat prog-fold" data-icon="chevron-left" data-i18n-title="tip_prog_fold"></button>
            <button class="runstat prog-stat idle" data-a="status">
              <i class="dot"></i><span class="st"><span class="st-long"></span><span class="st-short"></span></span>
              <svg class="ic chev" aria-hidden="true"><use href="#i-chevron-right"/></svg>
              <i class="st-bar"><b></b></i>
            </button>
            <span class="grow"></span>
            <button data-a="undo" class="icon flat" data-icon="undo" data-i18n-title="tip_undo"></button>
            <button data-a="redo" class="icon flat" data-icon="redo" data-i18n-title="tip_redo"></button>
            <button data-a="check" data-icon="check" data-i18n="check_prog" data-i18n-title="tip_check"></button>
            <!-- Step through (feature stepping; app-step.js): the program pauses before each step -->
            <button data-a="step" class="hidden" data-icon="step" data-i18n="btn_step"></button>
            <!-- Run and Stop share one place: the one that applies shows -->
            <span class="runstop">
              <button data-a="run" data-icon="play" data-i18n="run_prog"></button>
              <button data-a="stop" class="stop" data-icon="stop" data-i18n="stop" data-i18n-title="tip_stop" tabindex="-1"></button>
            </span>
            <!-- paused before a step (app-step.js): on to the end, or the next step (F10) -->
            <span class="stepbtns hidden" role="group">
              <button data-a="step_cont" data-icon="skip" data-i18n="go_on" data-i18n-title="tip_step_cont"></button>
              <button data-a="step_next" class="primary" data-icon="step" data-i18n="btn_step_next" data-i18n-title="tip_step_next_k"></button>
            </span>
            <button data-a="prog_menu" class="icon flat" data-icon="more" data-i18n-title="tip_prog_menu" aria-haspopup="menu"></button>
            <!-- a run by group while its card shows (app-group.js): the bar keeps its title, this thin
                 line of the groups done, and ⋯ -- Stop and the rest are the card's -->
            <i class="gc-line" aria-hidden="true"><b></b></i>
          </div>
          <div class="blockly">
            <!-- over the canvas, top right: a version from the AI held while the user was editing
                 (the canvas zooms with the wheel; Fit is in the run bar's ⋯, Ctrl+0) -->
            <div class="blk-bar">
              <span class="blk-held plate hidden"><svg class="ic hi" aria-hidden="true"><use href="#i-sparkle"/></svg><span class="ht"></span><button class="hload" data-a="held_load" data-i18n="held_load" data-i18n-title="tip_held"></button></span>
            </div>
            <!-- an empty program: where its first block goes, under the start block -->
            <div class="blk-empty hidden"></div>
            <!-- the run cursor, beside the step running now (app-run.js, renderCursor) -->
            <div class="run-cur plate hidden" aria-hidden="true"><svg class="ic"><use href="#i-play"/></svg></div>
            <!-- paused before a step (app-step.js): the next step beside it -- what it writes, where in
                 Aspen, its problems; information only, the buttons are the run bar's -->
            <div class="step-card plate hidden" role="status" aria-live="polite"></div>
            <!-- a step's left edge under the pointer: where its breakpoint's red dot would go -->
            <div class="brk-hint hidden" aria-hidden="true"></div>
          </div>
          </div>
          <!-- the folded column: a click opens the block program; a dot while it runs; ✦ and the
               count of the model's proposals in progress (a dot: one awaits review) -->
          <button class="prog-strip" data-a="prog_open">
            <svg class="ic" aria-hidden="true"><use href="#i-chevron-right"/></svg>
            <span class="ps-t" data-i18n="prog_title"></span>
            <i class="dot"></i>
            <span class="ps-prop hidden"><svg class="ic" aria-hidden="true"><use href="#i-sparkle"/></svg><b class="ps-n"></b><i class="ps-rv hidden"></i></span>
          </button>
        </div>
        <div class="vsplit" data-i18n-title="tip_vsplit"></div>
        <div class="pright">
          <div class="fs-wrap">
            <div class="fs-area">
              <svg class="fs"></svg>
              <!-- a static fade at each edge where more of the drawing lies, and a hint there
                   that counts it (a click pans that way) -->
              <div class="fs-fade x"></div><div class="fs-fade y"></div>
              <button class="fs-hint plate hidden" data-side="l"><svg class="ic" aria-hidden="true"><use href="#i-chevron-left"/></svg><span class="eh"></span></button>
              <button class="fs-hint plate hidden" data-side="r"><span class="eh"></span><svg class="ic" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
              <button class="fs-hint plate hidden" data-side="t"><svg class="ic" aria-hidden="true"><use href="#i-chevron-up"/></svg><span class="eh"></span></button>
              <button class="fs-hint plate hidden" data-side="b"><svg class="ic" aria-hidden="true"><use href="#i-chevron-down"/></svg><span class="eh"></span></button>
              <!-- floats over the drawing: glass, so the flowsheet shows through. The chip says
                   what is picked ("REACTOR › RCSTR"; a click finds it), only while something is.
                   The capsule holds the layers, the zoom (a click fits the drawing) and ⋯, the
                   flowsheet's menu: the arrangement, how blocks are drawn, the legend, export.
                   Which model this is: the header. -->
              <div class="right-bar">
                <!-- a proposal's preview on the drawing (app-preview.js): a state, so it is not taken
                     for the model; pressed, the preview hides and the pill keeps its eye -->
                <button class="fs-pvp plate hidden" data-a="pv_pill" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg><span class="pvp-w"></span></button>
                <span class="fs-chip lens hidden">
                  <span class="fc-sel"><button class="fc-tg" data-a="find_sel" data-i18n-title="tip_find_sel"><b></b><svg class="ic sep" aria-hidden="true"><use href="#i-chevron-right"/></svg><small></small></button></span>
                </span>
                <span class="grow"></span>
                <span class="fs-tools lens">
                  <!-- the layers: the heat plans always there, off (saying how) until a pinch run -->
                  <span class="fg">
                    <button data-a="values" class="tgl" data-icon="values" data-i18n="btn_values" data-i18n-title="tip_values"></button>
                    <button data-a="heat" class="tgl" data-icon="flame" data-i18n="btn_heat" data-i18n-title="tip_heat"></button>
                  </span>
                  <i class="fsep"></i>
                  <!-- the zoom, as a percentage; a click shows the whole drawing (the wheel zooms) -->
                  <button data-a="fit" class="zpct" data-i18n-title="tip_zpct">100%</button>
                  <i class="fsep"></i>
                  <!-- the flowsheet's menu (app-flowsheet.js fsMenuItems); busy while Aspen's drawing is read -->
                  <button data-a="fs_menu" class="fs-more" data-icon="more" data-i18n-title="tip_fs_menu" aria-haspopup="menu"></button>
                </span>
              </div>
              <!-- a heat plan, while the heat plans layer shows: a glass card at the bottom left
                   (app-heat.js, renderPlan) with the plan switch, its exchangers and the utilities still
                   needed (a row's pointer dims the other arcs, a click finds its arc), the heat
                   recovered and Ask AI to apply. A short card folds it to its head row, which
                   opens upward. -->
              <div class="fs-plan lens hidden">
                <div class="pl-head">
                  <svg class="ic pl-ic" aria-hidden="true"><use href="#i-flame"/></svg><b class="pl-title" data-i18n="btn_heat"></b>
                  <span class="pl-seg"></span><span class="pl-sum"></span>
                  <button class="pl-fold" data-p="fold"><svg class="ic" aria-hidden="true"><use href="#i-chevron-up"/></svg></button>
                </div>
                <div class="pl-body">
                  <div class="pl-list"></div>
                  <div class="pl-foot"><span class="pl-rec"></span><span class="grow"></span><button class="pl-ask" data-p="ask" data-icon="sparkle" data-i18n="btn_heat_apply" data-i18n-title="tip_heat_apply"></button></div>
                </div>
              </div>
              <!-- a proposal approved by group (app-group.js): the group it is about to
                   apply, or applying -- where it is ("1 / 2"), the group's title and why (or what was
                   set by hand that the group sets again), Stop, Apply the rest and Apply group (F10).
                   Bottom centre of the free area, a lens; Enter presses it only while it has the focus -->
              <div class="gc-card lens hidden" role="group" tabindex="0">
                <span class="gc-pos"></span>
                <span class="gc-body"><span class="gc-l1"><b class="gc-t"></b><span class="gc-prn"></span></span><span class="gc-l2"></span></span>
                <button class="flat gc-stop" data-gc="stop"></button>
                <button class="gc-rest" data-gc="rest"></button>
                <button class="primary gc-go" data-gc="go"></button>
              </div>
              <!-- the Values layer on, zoomed out past reading: a static line says to zoom in
                   (app-flowsheet.js, renderEdges) -->
              <div class="fs-far plate hidden" data-i18n="vals_far" aria-live="polite"></div>
              <!-- a stream's values where the pointer rests on it (app-flowsheet.js, peek) -->
              <div class="fs-peek plate hidden" aria-hidden="true"></div>
            </div>
            <!-- the inspector: built once, its parts filled in (app-inspector.js, renderInspector), so the
                 filter keeps its caret and an IME composition while the rows change -->
            <aside class="insp lens hidden">
              <!-- its left edge: dragged, it widens (app-inspector.js); a double-click, back to the default -->
              <div class="insp-grip" data-i18n-title="tip_insp_grip" aria-hidden="true"></div>
              <!-- the head: what it is, then its actions as icons -- Ask AI about it, add it to the
                   program, check for edits made in Aspen's own window (feature external) -- and × -->
              <div class="ih">
                <span class="it"><svg class="ic ik" aria-hidden="true"><use href="#i-block"/></svg><b class="iname"></b><small class="itype"></small><span class="lvl hidden"></span></span>
                <span class="ia">
                  <button class="ask flat icon" data-act="note" data-icon="sparkle" data-i18n-title="tip_insp_note"></button>
                  <button class="flat icon" data-act="block" data-icon="plus" data-i18n-title="tip_insp_block"></button>
                  <button class="ideep flat icon hidden" data-act="ext_deep" data-icon="aspen"></button>
                </span>
                <button class="x" data-act="close" data-i18n-title="close_esc"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
              </div>
              <!-- what Aspen still needs of it, or that it needs nothing (app-inspector.js, renderStatus) -->
              <div class="istat hidden"></div>
              <!-- one status line under the head (app-inspector.js, oneBand): the most important of the
                   lines below shows, the others in its tooltip. What a check for edits in Aspen came to
                   (renderDeep) -->
              <div class="iext hidden"></div>
              <!-- a program paused before a step: an edit here is yours, and kept -->
              <div class="ipaused hidden"></div>
              <div class="ierrs"></div>
              <div class="ifrow">
                <label class="ifbox"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input class="ifilter" data-i18n-ph="insp_filter" spellcheck="false"></label>
                <label class="iall" data-i18n-title="tip_insp_all"><input type="checkbox" data-act="all"><span data-i18n="insp_all"></span></label>
              </div>
              <div class="itip hidden"></div>
              <div class="irows"></div>
            </aside>
          </div>
          <div class="hsplit" data-i18n-title="tip_hsplit"><i></i><i></i><i></i></div>
          <div class="panel dock">
            <div class="dnav">
              <nav>
                <i class="seg glide gx"></i>
                <button data-tab="msgs" class="on" data-i18n-title="tip_tab_msgs"><span data-i18n="tab_msgs"></span><i class="ai-dot"></i></button>
                <!-- who changed what in the model (changes.js), where the server offers it -->
                <button data-tab="changes" class="hidden" data-i18n-title="tip_tab_changes"><span data-i18n="tab_changes"></span><span class="ch-count hidden"></span></button>
                <button data-tab="log" data-i18n-title="tip_tab_log"><span data-i18n="run_log"></span><i class="run-dot"></i></button>
                <button data-tab="results" data-i18n-title="tip_tab_results"><span data-i18n="tab_results"></span><i class="res-dot"></i></button>
              </nav>
              <!-- collapsed dock only: a way back to the conversation -->
              <button class="dock-ask" data-dock="ask" data-icon="sparkle" data-i18n="ask_ph" data-i18n-title="tip_dock_ask"></button>
              <span class="grow"></span>
              <!-- the shown tab's own menu (app-layout.js dockItems): Changes -- what the record covers,
                   pick changes to turn into blocks, the report; Tables & charts -- the result as CSV.
                   None on the AI chat, nor where the tab has nothing to offer -->
              <button class="icon flat dock-more hidden" data-dock="more" data-icon="more" data-i18n-title="tip_dock_more" aria-haspopup="menu" aria-expanded="false"></button>
              <button class="icon flat" data-dock="max" data-icon="maximize" data-i18n-title="tip_dock_max"></button>
              <button class="icon flat" data-dock="min" data-icon="chevron-down" data-i18n-title="tip_dock_min"></button>
            </div>
            <!-- the AI's confirmation cards (app-brake.js): over the Changes tab's timeline (over the
                 AI chat where there is none), a line over the AI chat while one waits -->
            <div class="bk-dock"></div>
            <div class="tab tab-msgs chat-list on"></div>
            <div class="tab tab-changes"></div>
            <div class="tab tab-log"></div>
            <div class="tab tab-results"></div>
            <!-- the composer, under all the panels: built once and never redrawn, so a draft
                 (and an IME composition) survives every state. The chip is what it asks about. -->
            <div class="composer">
              <div class="cbox">
                <span class="cchip"><svg class="ic" aria-hidden="true"><use href="#i-tab"/></svg><span class="cl"></span><button class="cx" data-c="clear" data-i18n-title="tip_c_clear"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></span>
                <textarea class="cta" rows="1" data-i18n-ph="ask_ph" data-i18n-title="tip_cta" spellcheck="false"></textarea>
                <button class="csend" data-c="send" data-i18n-title="tip_send"><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
              </div>
              <div class="chint"><i class="dot"></i><span class="ch-text"></span><button class="ch-copy flat" data-c="copy" data-icon="copy" data-i18n="copy" data-i18n-title="tip_c_copy"></button><span class="ch-keys" data-i18n="c_keys"></span></div>
            </div>
          </div>
        </div>
        <!-- the AI's proposal, on a proposal only (app-proposal.js): a window floating over
             the page -- dragged by its head, sized from any edge or corner, × hides it and ✦ "Proposal" (prop_title) in the run
             bar brings it back; what it does and why, the decision (approve and run, step through,
             send back), then each step with its current and proposed value. The blocks under it
             are the proposal's. -->
        <section class="prop-card float lens hidden"></section>
      </div>
      <div class="pempty hint hidden" data-i18n="pane_empty"></div>
    </section>
  </template>

  <!-- menus: the + menu, the ... menu, a tab's context menu; #menu2 is a submenu -->
  <div id="menu" class="menu plate hidden" role="menu" tabindex="-1"></div>
  <div id="menu2" class="menu plate hidden" role="menu" tabindex="-1"></div>
  <!-- dialogs: text (rename, a request), a confirmation, a list -->
  <div id="modal" class="modal hidden">
    <div class="card plate" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-title" class="mtitle"></div>
      <div id="modal-body" class="mbody hidden"></div>
      <textarea id="modal-text" rows="4"></textarea>
      <div id="modal-help" class="modal-help hidden"></div>
      <div class="row">
        <!-- (their words are set each time a dialog opens: a language switch while one is
             open must not turn its own confirm button into a plain OK) -->
        <button id="modal-del" class="danger"></button>
        <button id="modal-alt"></button>
        <span class="grow"></span>
        <button id="modal-cancel"></button>
        <button id="modal-ok" class="primary"></button>
      </div>
    </div>
  </div>
  <div id="toast" class="plate" role="status"></div>
  <!-- the beginner tour (app-tour.js): a ring around what a step is about, dimming the rest
       (it takes no pointer: the page stays usable under it), and a card beside it. Not
       modal: nothing traps the focus. -->
  <div id="tour" class="tour-layer hidden">
    <div class="tour-ring" aria-hidden="true"></div>
    <div class="tour-card plate" role="dialog" aria-modal="false" aria-labelledby="tour-title" aria-describedby="tour-body">
      <div class="tc-step"></div>
      <div class="tc-title" id="tour-title"></div>
      <div class="tc-body" id="tour-body"></div>
      <div class="tc-row">
        <button class="flat tc-skip" data-tour="skip"></button>
        <span class="grow"></span>
        <button data-tour="prev"></button>
        <button class="primary" data-tour="next"></button>
        <button class="primary" data-tour="done"></button>
      </div>
    </div>
  </div>

  <!-- Liquid glass lenses: app-glass.js (lens) adds one filter per glass element, with a displacement
       map drawn for its size; Chromium (WebView2) applies them as backdrop filters. -->
  <svg id="wb-lenses" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
</body>
</html>
